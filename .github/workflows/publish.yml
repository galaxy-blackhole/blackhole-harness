# author Bùi Trọng Hiếu
# email kevinbui210191@gmail.com
# create date 15/10/2026
# modify date 23/11/2026
# desc Publish @galaxy-blackhole/blackhole-harness len npm khi push len main.
#      Dung TRUSTED PUBLISHING (OIDC) — khong can NPM_TOKEN; npm>=11.5 moi ho tro.
#      Ten tep phai khop "Workflow filename" da khai tren npmjs: publish.yml
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Nang npm de ho tro OIDC trusted publishing
        run: npm install -g npm@latest && npm --version
      - name: Cai dat (khong chan publish neu CI thieu goi he thong)
        continue-on-error: true
        run: |
          bun install --no-save --ignore-scripts || true
          # 92 goi vendor nguyen lib/** tu kernel dong bang nam trong apps/host/node_modules
          # (vi du packages/host/util-values/build.ts cpSync tu @deepseek-ai/dsh-util-values).
          # apps/host cai rieng (khong thuoc workspace) nen root install khong mang no sang.
          (cd apps/host && bun install --no-save) || true
      # 23/11/2026: lib/ nam trong .gitignore nen runner checkout KHONG co artifact da build. Ban 0.1.15
      # phat hanh thieu lib/ (0 tep lib/index.js so voi 328 cua 0.1.14) => may moi cai tu npm phai build
      # lai bang bun moi mount duoc; khong co bun thi host thoat ma 1 ("4 required plugins did not
      # activate"). Buoc nay dung lai dung thu ban 0.1.14 co: moi goi mot lib/index.js da build.
      - name: Build lib/ cho moi goi (ban npm phai co .js da build)
        run: |
          built=0
          failed=""
          for dir in packages/*/*/; do
            if [ ! -f "$dir/build.ts" ]; then continue; fi
            if (cd "$dir" && bun run build.ts >/tmp/pkg-build.log 2>&1); then
              built=$((built + 1))
            else
              failed="$failed $dir"
              tail -5 /tmp/pkg-build.log
            fi
          done
          count=$(find packages -path '*/lib/index.js' | wc -l | tr -d ' ')
          echo "goi build xong: $built · lib/index.js: $count"
          if [ -n "$failed" ]; then echo "canh bao: $built goi build loi:$failed"; fi
      # Checkout sach KHONG dung lai duoc toan bo lib/: 13 goi de-bundle chi chep nguyen cay lib/
      # (tools/debundle-guard.ts), 48 goi khong co build.ts (artefact sinh bang tools khac). Vi vay lay
      # moi tep lib/** ma ban 0.1.14 da phat hanh ma ta CHUA co — khong de len artefact vua build.
      - name: Bu lib/ con thieu tu ban 0.1.14 (khong de len ban vua build)
        run: |
          url=$(npm view @galaxy-blackhole/blackhole-harness@0.1.14 dist.tarball)
          rm -rf /tmp/prev && mkdir -p /tmp/prev
          curl -fsSL "$url" -o /tmp/prev/prev.tgz && tar -xzf /tmp/prev/prev.tgz -C /tmp/prev
          added=0
          ( cd /tmp/prev/package && find packages -path '*/lib/*' -type f -print0 ) | while IFS= read -r -d '' f; do
            if [ -e "$f" ]; then continue; fi
            mkdir -p "$(dirname "$f")"
            cp "/tmp/prev/package/$f" "$f"
          done
          added=$( ( cd /tmp/prev/package && find packages -path '*/lib/*' -type f ) | while read -r f; do [ -e "$f" ] && echo x; done | wc -l | tr -d ' ' )
          echo "tep lib/** co san sau khi bu: $added"
      - name: Cong kiem lib/ truoc khi publish
        run: |
          count=$(find packages -path '*/lib/index.js' | wc -l | tr -d ' ')
          echo "lib/index.js: $count (0.1.14: 328)"
          if [ "$count" -lt 320 ]; then echo "thieu lib/index.js: $count < 320" >&2; exit 1; fi
      - name: Publish harness
        env:
          GBH_HARNESS_VERSION: 0.1.16
        run: bun run tools/publish-harness.mjs --trusted