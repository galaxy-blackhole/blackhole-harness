# author Bùi Trọng Hiếu
# email kevinbui210191@gmail.com
# create date 15/10/2026
# modify date 23/11/2026
# desc Publish @galaxy-blackhole/blackhole-harness len npm khi push len main.
#      Dung TRUSTED PUBLISHING (OIDC) — khong can NPM_TOKEN; npm>=11.5 moi ho tro.
#      Ten tep phai khop "Workflow filename" da khai tren npmjs: publish.yml
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Nang npm de ho tro OIDC trusted publishing
        run: npm install -g npm@latest && npm --version
      - name: Cai dat (khong chan publish neu CI thieu goi he thong)
        continue-on-error: true
        run: |
          bun install --no-save --ignore-scripts || true
          # 92 goi vendor nguyen lib/** tu kernel dong bang nam trong apps/host/node_modules
          # (vi du packages/host/util-values/build.ts cpSync tu @deepseek-ai/dsh-util-values).
          # apps/host cai rieng (khong thuoc workspace) nen root install khong mang no sang.
          (cd apps/host && bun install --no-save) || true
      # 23/11/2026 (Lead, sau khi bisect bang Electron): artifact lib/ do CI build lai KHONG tuong duong
      # ban 0.1.14 da build tren may — client entry "cot-translation" ket "loading" va boot UI chan ca app
      # (tai hien tren macOS voi 0.1.18, 0.1.14 thi sach). Vi vay KHONG build lai tat ca nua: lay nguyen
      # lib/ cua ban 0.1.14 (ban da chay dung) lam nen, roi chi build lai DUNG cac goi ta sua trong ngay.
      - name: Lay lib/ cua ban 0.1.14 lam nen
        run: |
          url=$(npm view @galaxy-blackhole/blackhole-harness@0.1.14 dist.tarball)
          rm -rf /tmp/base && mkdir -p /tmp/base
          curl -fsSL "$url" -o /tmp/base/base.tgz && tar -xzf /tmp/base/base.tgz -C /tmp/base
          ( cd /tmp/base/package && find packages -path '*/lib/*' -type f -print0 ) | while IFS= read -r -d '' f; do
            mkdir -p "$(dirname "$f")"
            cp "/tmp/base/package/$f" "$f"
          done
          count=$(find packages -path '*/lib/index.js' | wc -l | tr -d ' ')
          echo "lib/index.js sau khi lay nen 0.1.14: $count (0.1.14 co 328)"
      - name: Build lai dung cac goi da sua trong ngay
        run: |
          set -e
          for dir in packages/host/goal packages/host/agent-preset-registry; do
            echo "--- build $dir"
            ( cd "$dir" && bun run build.ts )
          done
          # mat typert cua goal phai co trong lib/ (tang mount chi chep lib/)
          test -f packages/host/goal/lib/typert-face/typert.host.js
          node -e "const p=require('./packages/host/goal/package.json');const t=p.exports['./typert'];const ok=typeof t==='string'||typeof (t&&t.default)==='string';if(!ok){console.error('goal exports[\"./typert\"] thieu default kieu chuoi');process.exit(1)};console.log('goal export OK')"
          grep -q "GBH_LOG" packages/host/agent-preset-registry/lib/index.js
          echo "ban va da nam trong lib/"
      - name: Cong kiem truoc khi publish
        run: |
          count=$(find packages -path '*/lib/index.js' | wc -l | tr -d ' ')
          echo "lib/index.js: $count"
          if [ "$count" -lt 320 ]; then echo "thieu lib/index.js: $count < 320" >&2; exit 1; fi
      - name: Publish harness
        env:
          GBH_HARNESS_VERSION: 0.1.19
        run: |
          # Moi push len main deu chay workflow nay, nhung chi version MOI moi publish duoc. Bo qua khi
          # version da co tren npm de push tai lieu/workflow khong sinh mot luot do gia.
          version="$GBH_HARNESS_VERSION"
          if npm view "@galaxy-blackhole/blackhole-harness@$version" version >/dev/null 2>&1; then
            echo "version $version da co tren npm — bo qua publish"
            exit 0
          fi
          bun run tools/publish-harness.mjs --trusted