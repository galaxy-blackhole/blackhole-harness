# email kevinbui210191@gmail.com
# create date 15/10/2026
# modify date 23/11/2026
# desc Cổng hồi quy boot-probe: cài harness ĐÃ PUBLISH từ npm, boot host với profile sạch, rồi mở trang
#      bằng Chromium headless để bắt lớp lỗi "HTTP 200 nhưng client không kích hoạt" (sự cố 23/11/2026:
#      sổ typert rỗng vì typert-loader ném AggregateError). curl một mình KHÔNG bắt được lớp lỗi này.
name: boot-probe

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản harness trên npm (mặc định: latest)"
        required: false
        default: ""
  workflow_run:
    workflows: [publish]
    types: [completed]

jobs:
  probe:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cài harness từ npm vào thư mục tạm
        run: |
          version="${{ github.event.inputs.version }}"
          [ -z "$version" ] && version="latest"
          echo "probe harness @$version"
          mkdir -p /tmp/probe && cd /tmp/probe
          npm init -y >/dev/null
          npm install "@galaxy-blackhole/blackhole-harness@$version" --no-audit --no-fund 2>&1 | tail -2
      - name: Boot host với profile sạch
        run: |
          set -e
          cd /tmp/probe/node_modules/@galaxy-blackhole/blackhole-harness
          rm -rf /tmp/probe/home && mkdir -p /tmp/probe/home
          GBH_HOME=/tmp/probe/home node apps/cli/lib/main.js host --port 5611 > /tmp/probe/host.log 2>&1 &
          for i in $(seq 1 240); do
            if grep -q "5611/?token=" /tmp/probe/host.log 2>/dev/null; then break; fi
            sleep 1
          done
          url=$(grep -o "http://127.0.0.1:5611/?token=[^ ]*" /tmp/probe/host.log | head -1)
          if [ -z "$url" ]; then echo "host không in URL:"; tail -30 /tmp/probe/host.log; exit 1; fi
          echo "$url" > /tmp/probe/url.txt
          echo "boot xong: ${url:0:42}…"
      - name: Chromium + probe
        run: |
          set -e
          cd /tmp/probe
          npm i playwright --no-audit --no-fund 2>&1 | tail -1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node "$GITHUB_WORKSPACE/tools/boot-probe.mjs" "$(cat url.txt)"
      - name: Nhật ký host khi hỏng
        if: failure()
        run: |
          echo '=== host.log (60 dòng cuối) ==='; tail -60 /tmp/probe/host.log
          echo '=== log lỗi harness (nếu có) ==='; tail -40 /tmp/probe/home/logs/*.log 2>/dev/null || true
