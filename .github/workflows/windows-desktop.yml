# email kevinbui210191@gmail.com
# create date 15/10/2026
# modify date 19/11/2026
# desc Build app desktop Windows: stage harness 0.1.4 + node.exe win-x64, Tauri NSIS, upload artifact

name: windows-desktop

on:
  push:
    branches:
      - windows-desktop
  workflow_dispatch:
    inputs:
      smoke_only:
        description: "Chỉ test host, bỏ qua build Tauri"
        required: false
        default: false
        type: boolean
      installer_smoke:
        description: "Test installer artifact đã có (không build)"
        required: false
        default: false
        type: boolean
      cli_smoke:
        description: "Test blackhole web từ npm CLI (không build)"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Stage harness 0.1.4 from npm
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "gbh-stage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null
          npm install --prefix $stage @galaxy-blackhole/blackhole-harness@0.1.4 --omit=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install harness failed" }
          $pkg = Join-Path $stage "node_modules\@galaxy-blackhole\blackhole-harness"
          if (!(Test-Path $pkg)) { throw "harness package missing at $pkg" }
          $res = Join-Path (Get-Location) "apps\desktop-windows\src-tauri\resources"
          $hostDir = Join-Path $res "host"
          $runtimeDir = Join-Path $res "runtime"
          New-Item -ItemType Directory -Force $hostDir, $runtimeDir | Out-Null
          Copy-Item -Path (Join-Path $pkg "*") -Destination $hostDir -Recurse -Force
          Copy-Item -Path (Join-Path $stage "node_modules") -Destination (Join-Path $hostDir "node_modules") -Recurse -Force
          if (!(Test-Path (Join-Path $hostDir "apps\cli\lib\main.js"))) { throw "host lib/main.js missing" }
          # gbh-web-app import @deepseek-ai/dsh-web-frontend tu node_modules CUA GOI; ban npm khong mang
          # node_modules long, nen phai copy frontend vao dung vi tri (app self-contained da co san).
          $fe = Join-Path $stage "node_modules\@deepseek-ai\dsh-web-frontend"
          $nestedFe = Join-Path $hostDir "packages\host\web-app\node_modules\@deepseek-ai\dsh-web-frontend"
          if (!(Test-Path (Join-Path $fe "dist\index.html"))) { throw "frontend dist missing in stage" }
          New-Item -ItemType Directory -Force (Split-Path $nestedFe) | Out-Null
          Copy-Item -Path $fe -Destination $nestedFe -Recurse -Force
          if (!(Test-Path (Join-Path $nestedFe "dist\index.html"))) { throw "nested frontend copy failed" }
          # NSIS/makensis dùng đường dẫn ANSI/MAX_PATH: các tệp devtools mô tả rất dài trong
          # @deepseek-ai/dsh-experimental-inspector làm build fail. Bỏ devtools frontend (không dùng
          # trên đường boot web), rồi dọn mọi tệp còn dài hơn 220 ký tự để makensis mở được.
          $devtools = Join-Path $hostDir "node_modules\@deepseek-ai\dsh-experimental-inspector\lib\devtools"
          if (Test-Path $devtools) { Remove-Item -Recurse -Force $devtools }
          $long = Get-ChildItem $hostDir -Recurse -File | Where-Object { $_.FullName.Length -gt 220 }
          $longCount = @($long).Count
          if ($longCount -gt 0) {
            Write-Host "pruning $longCount long paths (>220 chars)"
            $long | Remove-Item -Force
          }

      - name: Stage Node win-x64 runtime
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "node-win.zip"
          $url = "https://nodejs.org/dist/v26.9.0/node-v26.9.0-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $out = Join-Path $env:RUNNER_TEMP "node-win"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $out
          $nodeExe = Join-Path $out "node-v26.9.0-win-x64\node.exe"
          if (!(Test-Path $nodeExe)) { throw "node.exe missing" }
          Copy-Item $nodeExe (Join-Path (Get-Location) "apps\desktop-windows\src-tauri\resources\runtime\node.exe") -Force

      - name: Patch host webserver static fallback
        shell: pwsh
        run: |
          node apps/desktop-windows/scripts/patch-webserver.mjs "apps\desktop-windows\src-tauri\resources\host"

      - name: Patch web diagnostics (smoke only)
        if: ${{ inputs.smoke_only == true }}
        shell: pwsh
        run: |
          $hostDir = Join-Path (Get-Location) "apps\desktop-windows\src-tauri\resources\host"
          $webApp = Join-Path $hostDir "packages\host\web-app\lib\index.js"
          $s = Get-Content $webApp -Raw
          Write-Host "webApp file=$webApp sha=$((Get-FileHash $webApp).Hash)"
          Write-Host "host web-app links:"
          Get-ChildItem (Join-Path $hostDir "node_modules\@galaxy-blackhole") -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'web-app' } | ForEach-Object { Write-Host "LINK $($_.Name) -> $($_.Target)" }
          $s = 'console.log("[diag] gbh-web-app module loaded");' + "`n" + $s
          $s = $s.Replace('function apply(ctx, config) {', 'function apply(ctx, config) { console.log("[diag] gbh-web-app apply"); try { console.log("[diag] dist="+internals.resolveDistIndex()); } catch(e){ console.log("[diag] distERR="+e.message); }')
          $s = $s.Replace('ctx.plugin(FrontendStatic, { distIndex: internals.resolveDistIndex() });', 'console.log("[diag] before FrontendStatic"); ctx.plugin(FrontendStatic, { distIndex: internals.resolveDistIndex() }); console.log("[diag] after FrontendStatic");')
          Set-Content -Path $webApp -Value $s -Encoding utf8
          $profilePath = Join-Path $hostDir "profiles\blackhole\package.json"
          $profile = Get-Content $profilePath -Raw | ConvertFrom-Json
          $profile.dsh.profile.bundles = @(
            "@galaxy-blackhole/gbh-bundle",
            "@galaxy-blackhole/gbh-client-settings-about",
            "@galaxy-blackhole/gbh-session-search",
            "@galaxy-blackhole/gbh-inspector-profile",
            "@galaxy-blackhole/gbh-terminal-bundle",
            "@galaxy-blackhole/gbh-badge-skill-bundle",
            "@galaxy-blackhole/gbh-auto-review-bundle",
            "@galaxy-blackhole/gbh-plugin-market-bundle",
            "@galaxy-blackhole/gbh-ralph-bundle",
            "@galaxy-blackhole/gbh-session-titles-bundle",
            "@galaxy-blackhole/gbh-tool-worktree-bundle",
            "@galaxy-blackhole/gbh-agent-team-profile",
            "@galaxy-blackhole/gbh-cot-translation-bundle",
            "@galaxy-blackhole/gbh-voice-input-bundle"
          )
          $profile | ConvertTo-Json -Depth 20 | Set-Content -Path $profilePath -Encoding utf8
          Write-Host "profile patched to GBH bundles"
          $bundlePatch = Join-Path $hostDir "packages\host\bundle\web-app.patch.yml"
          $bp = Get-Content $bundlePatch -Raw
          $bp = $bp.Replace("@galaxy-blackhole/gbh-web-app", "@deepseek-ai/dsh-web-app")
          Set-Content -Path $bundlePatch -Value $bp -Encoding utf8
          Write-Host "bundle web-app rows set to stock package"
          $fe = Join-Path $hostDir "node_modules\@deepseek-ai\dsh-web-frontend"
          $stockApp = Join-Path $hostDir "node_modules\@deepseek-ai\dsh-web-app\lib\index.js"
          if (Test-Path $stockApp) {
            $ss = Get-Content $stockApp -Raw
            $ss = 'console.log("[diag] stock dsh-web-app module loaded");' + "`n" + $ss
            $ss = $ss.Replace('function apply(ctx, config) {', 'function apply(ctx, config) { console.log("[diag] stock dsh-web-app apply"); try { console.log("[diag] stock dist="+internals.resolveDistIndex()); } catch(e){ console.log("[diag] stock distERR="+e.message); }')
            Set-Content -Path $stockApp -Value $ss -Encoding utf8
            Write-Host "stock web-app patched"
          }
          $stockNested = Join-Path $hostDir "node_modules\@deepseek-ai\dsh-web-app\node_modules\@deepseek-ai"
          New-Item -ItemType Directory -Force $stockNested | Out-Null
          Copy-Item -Path $fe -Destination (Join-Path $stockNested "dsh-web-frontend") -Recurse -Force
          $static = Join-Path $hostDir "node_modules\@deepseek-ai\dsh-host-frontend-static\lib\index.js"
          if (Test-Path $static) {
            $s = Get-Content $static -Raw
            $s = $s.Replace('function apply(ctx, config) {', 'function apply(ctx, config) { console.log("[diag] frontend-static apply");')
            $s = $s.Replace('const target = resolve(normalize(join(distRoot, pathname)));', 'const target = resolve(normalize(join(distRoot, pathname))); console.log("[diag] static path="+pathname+" target="+target+" root="+distRoot+" index="+distIndex);')
            $s = $s.Replace('res.writeHead(404);', 'console.log("[diag] static 404 path="+pathname); res.writeHead(404);')
            Set-Content -Path $static -Value $s -Encoding utf8
          }
          Write-Host "diagnostic patch applied"

      - name: Host smoke (Windows)
        if: ${{ inputs.smoke_only == true }}
        shell: pwsh
        run: |
          $hostDir = Join-Path (Get-Location) "apps\desktop-windows\src-tauri\resources\host"
          $node = Join-Path (Get-Location) "apps\desktop-windows\src-tauri\resources\runtime\node.exe"
          $homeDir = Join-Path $env:RUNNER_TEMP "gbh-home-smoke"
          New-Item -ItemType Directory -Force $homeDir | Out-Null
          $out = Join-Path $env:RUNNER_TEMP "host.out"
          $err = Join-Path $env:RUNNER_TEMP "host.err"
          $frontend = Join-Path $hostDir "node_modules\@deepseek-ai\dsh-web-frontend\dist\index.html"
          Write-Host "frontend index exists: $(Test-Path $frontend)"
          if (Test-Path $frontend) { Get-Item $frontend | Format-List FullName,Length }
          Get-ChildItem (Join-Path $hostDir "node_modules\@deepseek-ai\dsh-web-frontend\dist") -ErrorAction SilentlyContinue | Select-Object -First 10 | ForEach-Object { Write-Host "FE $($_.Name) $($_.Length)" }
          $env:GBH_LOG = "debug"
          $env:GBH_HOME = $homeDir
          $env:GBH_NODE = $node
          $env:GBH_REPO_ROOT = $hostDir
          $env:HOME = $env:USERPROFILE
          $p = Start-Process -FilePath $node -ArgumentList @((Join-Path $hostDir "apps\cli\lib\main.js"), "host", "--port", "55920") -PassThru -RedirectStandardOutput $out -RedirectStandardError $err -WorkingDirectory $hostDir
          $ready = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path $out) -and ((Get-Content $out -Raw -ErrorAction SilentlyContinue) -match '\[bh\] ready http://127\.0\.0\.1:')) { $ready = $true; break }
            if ($p.HasExited) { break }
          }
          Write-Host "=== stdout ==="; if (Test-Path $out) { Get-Content $out -Tail 40 }
          Write-Host "=== stderr ==="; if (Test-Path $err) { Get-Content $err -Tail 40 }
          $bad = 0
          if (Test-Path $out) { $bad += @(Select-String -Path $out -Pattern 'khong mount duoc|did not activate').Count }
          if (Test-Path $err) { $bad += @(Select-String -Path $err -Pattern 'khong mount duoc|did not activate').Count }
          $content = if (Test-Path $out) { Get-Content $out -Raw } else { "" }
          $url = [regex]::Match($content, 'http://127\.0\.0\.1:\d+/\?token=[^\s]+').Value
          if (-not $url) { throw "không parse được ready URL" }
          $root = $url -replace '/\?token=.*$', '/'
          $cookie = Join-Path $env:RUNNER_TEMP "host-cookie.txt"
          $ui = Join-Path $env:RUNNER_TEMP "host-ui.html"
          $fullCode = & curl.exe -sL -c $cookie -b $cookie -o $ui -w "%{http_code}" $url
          Write-Host "FULL CURL HTTP $fullCode"
          if ($fullCode -ne "200") {
            $uiText = if (Test-Path $ui) { Get-Content $ui -Raw } else { "" }
            Write-Host "=== web diagnostics ==="
            Select-String -Path $out, $err -Pattern 'rewrite|web-app|web-frontend|fallback|404|mount|cordis|link|ket|failed|error|warn' -ErrorAction SilentlyContinue | Select-Object -Last 80
            Write-Host "=== host.out head ==="; if (Test-Path $out) { Get-Content $out -TotalCount 60 }
            Write-Host "=== host.err ==="; if (Test-Path $err) { Get-Content $err -TotalCount 40 }
            throw "full token URL trả $fullCode :: $uiText"
          }
          if ((Get-Content $ui -Raw) -notmatch 'Galaxy Blackhole') { throw "HTML không chứa Galaxy Blackhole" }
          $rootCode = & curl.exe -s -o NUL -w "%{http_code}" $root
          Write-Host "ROOT CURL HTTP $rootCode"
          & taskkill /PID $p.Id /T /F | Out-Null
          if (-not $ready) { throw "host không ready" }
          if ($bad -gt 0) { throw "host có $bad dòng lỗi mount/activate" }
          Write-Host "HOST SMOKE OK"

      - name: CLI smoke (blackhole web 3.0.15)
        if: ${{ inputs.cli_smoke == true }}
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "gbh-cli-stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          npm install --prefix $stage @galaxy-stack/blackhole-cli@3.0.15 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install CLI failed" }
          $cli = Join-Path $stage "node_modules\@galaxy-stack\blackhole-cli\dist\cli.js"
          if (!(Test-Path $cli)) { throw "CLI entry missing" }
          $homeDir = Join-Path $env:RUNNER_TEMP "gbh-cli-home"
          New-Item -ItemType Directory -Force $homeDir | Out-Null
          $out = Join-Path $env:RUNNER_TEMP "cli.out"
          $err = Join-Path $env:RUNNER_TEMP "cli.err"
          $env:GBH_HOME = $homeDir
          $p = Start-Process -FilePath "node" -ArgumentList @($cli, "web", "--port", "55921", "--no-open") -PassThru -RedirectStandardOutput $out -RedirectStandardError $err -WorkingDirectory $env:RUNNER_TEMP
          $ready = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path $out) -and ((Get-Content $out -Raw -ErrorAction SilentlyContinue) -match 'gbh web: http://127\.0\.0\.1:')) { $ready = $true; break }
            if ($p.HasExited) { break }
          }
          Write-Host "=== cli stdout ==="; if (Test-Path $out) { Get-Content $out -Tail 30 }
          Write-Host "=== cli stderr ==="; if (Test-Path $err) { Get-Content $err -Tail 30 }
          if (-not $ready) { throw "CLI không in URL" }
          $url = [regex]::Match((Get-Content $out -Raw), 'http://127\.0\.0\.1:55921/\?token=[^\s]+').Value
          $cookie = Join-Path $env:RUNNER_TEMP "cli-cookie.txt"
          $ui = Join-Path $env:RUNNER_TEMP "cli-ui.html"
          $code = & curl.exe -sL -c $cookie -b $cookie -o $ui -w "%{http_code}" $url
          Write-Host "CLI FULL CURL HTTP $code"
          & taskkill /PID $p.Id /T /F | Out-Null
          if ($code -ne "200") { throw "CLI full token URL trả $code" }
          Write-Host "CLI SMOKE OK"

      - name: Installer smoke (artifact 14557204751)
        if: ${{ inputs.installer_smoke == true }}
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "installer.zip"
          $headers = @{ Authorization = "token ${{ github.token }}" }
          Invoke-WebRequest -Uri "https://api.github.com/repos/galaxy-blackhole/blackhole-harness/actions/artifacts/14557204751/zip" -Headers $headers -OutFile $zip
          $dir = Join-Path $env:RUNNER_TEMP "installer"
          Expand-Archive $zip $dir -Force
          $setup = Get-ChildItem $dir -Recurse -Filter "*setup.exe" | Select-Object -First 1
          if (!$setup) { throw "setup.exe missing" }
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Recurse -Filter "galaxy-blackhole.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$exe) { $exe = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter "galaxy-blackhole.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (!$exe) { throw "installed galaxy-blackhole.exe not found" }
          $log = Join-Path $env:LOCALAPPDATA "Galaxy Blackhole\logs\desktop.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe.FullName -PassThru
          $ready = $false
          for ($i = 0; $i -lt 150; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'http://127\.0\.0\.1:\d+/\?token=' -Quiet)) { $ready = $true; break }
            if ($p.HasExited) { break }
          }
          Write-Host "=== desktop.log ==="; if (Test-Path $log) { Get-Content $log -Tail 80 }
          & taskkill /IM galaxy-blackhole.exe /T /F | Out-Null
          if (-not $ready) { throw "installed app không ready" }
          Write-Host "INSTALLER SMOKE OK"

      - name: Install Tauri CLI
        if: ${{ github.event_name == 'push' || (!inputs.smoke_only && !inputs.installer_smoke && !inputs.cli_smoke) }}
        shell: pwsh
        run: npm install --prefix apps/desktop-windows --no-audit --no-fund

      - name: Build Tauri NSIS
        if: ${{ github.event_name == 'push' || (!inputs.smoke_only && !inputs.installer_smoke && !inputs.cli_smoke) }}
        shell: pwsh
        run: npm --prefix apps/desktop-windows run build

      - name: Upload installer
        if: ${{ github.event_name == 'push' || (!inputs.smoke_only && !inputs.installer_smoke && !inputs.cli_smoke) }}
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-blackhole-windows
          path: apps/desktop-windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
