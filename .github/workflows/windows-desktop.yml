# desc Build app desktop Windows: stage harness 0.1.4 + node.exe win-x64, Tauri NSIS, upload artifact

name: windows-desktop

on:
  push:
    branches:
      - windows-desktop
  workflow_dispatch:
    inputs:
      smoke_only:
        description: "Chỉ test host, bỏ qua build Tauri"
        required: false
        default: false
        type: boolean
      installer_smoke:
        description: "Test installer artifact đã có (không build)"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Stage harness 0.1.4 from npm
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "gbh-stage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null
          npm install --prefix $stage @galaxy-blackhole/blackhole-harness@0.1.4 --omit=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install harness failed" }
          $pkg = Join-Path $stage "node_modules\@galaxy-blackhole\blackhole-harness"
          if (!(Test-Path $pkg)) { throw "harness package missing at $pkg" }
          $res = Join-Path (Get-Location) "apps\desktop-windows\src-tauri\resources"
          $hostDir = Join-Path $res "host"
          $runtimeDir = Join-Path $res "runtime"
          New-Item -ItemType Directory -Force $hostDir, $runtimeDir | Out-Null
          Copy-Item -Path (Join-Path $pkg "*") -Destination $hostDir -Recurse -Force
          Copy-Item -Path (Join-Path $stage "node_modules") -Destination (Join-Path $hostDir "node_modules") -Recurse -Force
          if (!(Test-Path (Join-Path $hostDir "apps\cli\lib\main.js"))) { throw "host lib/main.js missing" }
          # NSIS/makensis dùng đường dẫn ANSI/MAX_PATH: các tệp devtools mô tả rất dài trong
          # @deepseek-ai/dsh-experimental-inspector làm build fail. Bỏ devtools frontend (không dùng
          # trên đường boot web), rồi dọn mọi tệp còn dài hơn 220 ký tự để makensis mở được.
          $devtools = Join-Path $hostDir "node_modules\@deepseek-ai\dsh-experimental-inspector\lib\devtools"
          if (Test-Path $devtools) { Remove-Item -Recurse -Force $devtools }
          $long = Get-ChildItem $hostDir -Recurse -File | Where-Object { $_.FullName.Length -gt 220 }
          $longCount = @($long).Count
          if ($longCount -gt 0) {
            Write-Host "pruning $longCount long paths (>220 chars)"
            $long | Remove-Item -Force
          }

      - name: Stage Node win-x64 runtime
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "node-win.zip"
          $url = "https://nodejs.org/dist/v26.9.0/node-v26.9.0-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $out = Join-Path $env:RUNNER_TEMP "node-win"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $out
          $nodeExe = Join-Path $out "node-v26.9.0-win-x64\node.exe"
          if (!(Test-Path $nodeExe)) { throw "node.exe missing" }
          Copy-Item $nodeExe (Join-Path (Get-Location) "apps\desktop-windows\src-tauri\resources\runtime\node.exe") -Force

      - name: Host smoke (Windows)
        if: ${{ inputs.smoke_only == true }}
        shell: pwsh
        run: |
          $hostDir = Join-Path (Get-Location) "apps\desktop-windows\src-tauri\resources\host"
          $node = Join-Path (Get-Location) "apps\desktop-windows\src-tauri\resources\runtime\node.exe"
          $homeDir = Join-Path $env:RUNNER_TEMP "gbh-home-smoke"
          New-Item -ItemType Directory -Force $homeDir | Out-Null
          $out = Join-Path $env:RUNNER_TEMP "host.out"
          $err = Join-Path $env:RUNNER_TEMP "host.err"
          $env:GBH_HOME = $homeDir
          $env:GBH_NODE = $node
          $env:GBH_REPO_ROOT = $hostDir
          $env:HOME = $env:USERPROFILE
          $p = Start-Process -FilePath $node -ArgumentList @((Join-Path $hostDir "apps\cli\lib\main.js"), "host", "--port", "55920") -PassThru -RedirectStandardOutput $out -RedirectStandardError $err -WorkingDirectory $hostDir
          $ready = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path $out) -and ((Get-Content $out -Raw -ErrorAction SilentlyContinue) -match '\[bh\] ready http://127\.0\.0\.1:')) { $ready = $true; break }
            if ($p.HasExited) { break }
          }
          Write-Host "=== stdout ==="; if (Test-Path $out) { Get-Content $out -Tail 40 }
          Write-Host "=== stderr ==="; if (Test-Path $err) { Get-Content $err -Tail 40 }
          $bad = 0
          if (Test-Path $out) { $bad += @(Select-String -Path $out -Pattern 'khong mount duoc|did not activate').Count }
          if (Test-Path $err) { $bad += @(Select-String -Path $err -Pattern 'khong mount duoc|did not activate').Count }
          $content = if (Test-Path $out) { Get-Content $out -Raw } else { "" }
          $url = [regex]::Match($content, 'http://127\.0\.0\.1:\d+/\?token=[^\s]+').Value
          if (-not $url) { throw "không parse được ready URL" }
          $root = $url -replace '/\?token=.*$', '/'
          $full = Invoke-WebRequest -Uri $url -UseBasicParsing -MaximumRedirection 5
          Write-Host "FULL HTTP $($full.StatusCode) len=$($full.Content.Length)"
          if ($full.StatusCode -ne 200) { throw "full token URL trả $($full.StatusCode)" }
          if ($full.Content -notmatch 'Galaxy Blackhole') { throw "HTML không chứa Galaxy Blackhole" }
          $rootResp = Invoke-WebRequest -Uri $root -UseBasicParsing -SkipHttpErrorCheck
          Write-Host "ROOT HTTP $($rootResp.StatusCode)"
          & taskkill /PID $p.Id /T /F | Out-Null
          if (-not $ready) { throw "host không ready" }
          if ($bad -gt 0) { throw "host có $bad dòng lỗi mount/activate" }
          Write-Host "HOST SMOKE OK"

      - name: Installer smoke (artifact 14557204751)
        if: ${{ inputs.installer_smoke == true }}
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "installer.zip"
          $headers = @{ Authorization = "token ${{ github.token }}" }
          Invoke-WebRequest -Uri "https://api.github.com/repos/galaxy-blackhole/blackhole-harness/actions/artifacts/14557204751/zip" -Headers $headers -OutFile $zip
          $dir = Join-Path $env:RUNNER_TEMP "installer"
          Expand-Archive $zip $dir -Force
          $setup = Get-ChildItem $dir -Recurse -Filter "*setup.exe" | Select-Object -First 1
          if (!$setup) { throw "setup.exe missing" }
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Recurse -Filter "galaxy-blackhole.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$exe) { $exe = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter "galaxy-blackhole.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (!$exe) { throw "installed galaxy-blackhole.exe not found" }
          $log = Join-Path $env:LOCALAPPDATA "Galaxy Blackhole\logs\desktop.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe.FullName -PassThru
          $ready = $false
          for ($i = 0; $i -lt 150; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'http://127\.0\.0\.1:\d+/\?token=' -Quiet)) { $ready = $true; break }
            if ($p.HasExited) { break }
          }
          Write-Host "=== desktop.log ==="; if (Test-Path $log) { Get-Content $log -Tail 80 }
          & taskkill /IM galaxy-blackhole.exe /T /F | Out-Null
          if (-not $ready) { throw "installed app không ready" }
          Write-Host "INSTALLER SMOKE OK"

      - name: Install Tauri CLI
        if: ${{ github.event_name == 'push' || (!inputs.smoke_only && !inputs.installer_smoke) }}
        shell: pwsh
        run: npm install --prefix apps/desktop-windows --no-audit --no-fund

      - name: Build Tauri NSIS
        if: ${{ github.event_name == 'push' || (!inputs.smoke_only && !inputs.installer_smoke) }}
        shell: pwsh
        run: npm --prefix apps/desktop-windows run build

      - name: Upload installer
        if: ${{ github.event_name == 'push' || (!inputs.smoke_only && !inputs.installer_smoke) }}
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-blackhole-windows
          path: apps/desktop-windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
