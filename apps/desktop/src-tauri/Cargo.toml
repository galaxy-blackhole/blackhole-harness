[package]
name = "gbh-desktop"
version = "0.1.0"
edition = "2021"
description = "Galaxy Blackhole Desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
