<!doctype html>
<html lang="vi" style="background:#0b0d10">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galaxy Blackhole</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: #0b0d10;
        color: #e8edf2;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .box { max-width: 680px; padding: 24px 28px; border: 1px solid #26303a; border-radius: 14px; background: #121820; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0; color: #9fb0c0; }
      code { color: #7dd3fc; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Galaxy Blackhole</h1>
      <p>Đang khởi động harness… Cửa sổ sẽ tự chuyển sang giao diện khi host sẵn sàng.</p>
    </div>
    <script>
      // The window is hidden until WebView2 has painted this page; otherwise the
      // first frame is a white rectangle. A 2 s Rust fallback also shows it.
      function showWindow() {
        try {
          if (window.__TAURI_INTERNALS__) {
            void window.__TAURI_INTERNALS__.invoke("ui_ready");
          }
        } catch (_) {}
      }
      if (document.readyState === "complete") showWindow();
      else window.addEventListener("load", showWindow);
    </script>
  </body>
</html>
