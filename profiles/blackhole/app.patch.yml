# author Bùi Trọng Hiếu
# email kevinbui210191@gmail.com
# create date 15/10/2026
# modify date 20/10/2026
# desc Lop patch CUOI CUNG cua app: ngu nghia san pham Galaxy (M1a) + credentials dung chung
#
# Sinh boi `bh host` moi lan boot: ghep tu profiles/blackhole/parity.patch.yml (ngu nghia patch cua
# oracle — xem docs/ADR/0003), roi ghim credentials o cuoi. KHONG chua secret: chi duong dan file
# va ten bien env (GBH_GALAXY_API_KEY duoc khai la apiKeyEnv, gia tri nam trong credential store).

# 11/11/2026: persona cua deployment dung bien {{model_label}} (route auto ⇒ 'Galaxy Blackhole', khac ⇒ ten that).
#
# NGUON SU THAT (chi doc, khong bao gio sua):
#   galaxy-code/web/patches/gbh-web.patch.yml    -> 10 row duoi day
#   galaxy-code/web/patches/gbh-ui.patch.yml     -> rong ([]), khong co gi phai chep
#   (khoi brand-galaxy da bi XOA 17/10/2026: row ui-brand-official nay do metadata gbh.row cua
#    packages/client/ui-brand sinh ra, khong con lay tu galaxy-code nua)
#   /tmp/gbh-alpha/gbh-overlay.patch.yml         -> row credentials, do `bh host` sinh (khong chep o day)
#
# `bh host` doc file nay roi ghep vao <DSH_HOME>/app.patch.yml — lop CUOI CUNG cua cay plugin.
# M2 se thay bang hop dong da dong bang; M5 se thay @galaxy-stack/gbh-brand bang
# @galaxy-blackhole/gbh-brand do ta viet (G3). Xem docs/ADR/0003.

# 11/11/2026 — BO GHIM "welcome notice da xem" o lop app: da chuyen xuong patch cua BUNDLE
# (packages/host/bundle/web-app.patch.yml, config cua row ui-settings-general). Ghim o lop overlay
# lam moi luot ghi vao namespace ui-settings-general bi Host tu choi (settings/rejected) — do that
# tren app 5439: muc "danh dau da doc thong bao chao" ghi KHONG duoc.

# Tuyen model mac dinh cua agent: route rieng cua Galaxy (`auto`), khong phai route official.
- id: agent-default-model
  config:
    provider: auto
    model: deepseek-v4.1-flash

# 11/11/2026 — BO GHIM cau hinh llm-pi-ai o lop app: da chuyen xuong patch cua BUNDLE
# (packages/host/bundle/cordis.patch.yml, config cua row llm-pi-ai). Ghim o overlay lam trang
# Cai dat -> Model ghi KHONG duoc (settings/rejected: overridden by a home patch).
# Khoa bearer van den DSH qua bien GBH_GALAXY_API_KEY — KHONG co secret nao trong file patch.
# Tat route official cua DeepSeek de trang Models chi con route Galaxy.
- id: llm-deepseek
  disabled: true

# 11/11/2026 — BO GHIM o day: row + config cua "Subagent dung dung model chinh" da chuyen xuong
#   patch cua BUNDLE (packages/host/bundle/web-app.patch.yml). Ghim o lop overlay khien
#   settings/mutate bi tu choi (row do overlay cam ⇒ tai lieu nguoi dung khong ghi de duoc).

# Web search di qua Galaxy cloud; provider search cua DeepSeek bi go.
- id: web
  config:
    searchProvider: auto
    fetchProvider: http

# 10/11/2026 — KHÔI PHỤC sau khi bi revert nhầm (xem báo cáo dev-6): row web-search-deepseek đã bị xoá khỏi
# template (Option A 26/10/2026 — provider search đi qua Galaxy cloud ở row `web`, không tắt row stock nữa).
# Phần dưới là các row GBH đã thay id stock, giữ nguyên nội dung đang chạy trước khi bị revert.
- id: session-log-gbh
  disabled: true

- id: ui-settings-session-log
  disabled: true

# Persona của agent (fallback của deployment — ba preset "coding agent" tự đặt cùng mẫu này).
# 11/11/2026: dùng biến `model_label` thay vì chữ cứng hay `{{model}}`; `{{model}}` là id TRÊN DÂY nên route
# `auto` in ra "…deepseek-v4.1-flash model" (lỗi người dùng báo). `model_label` = "Galaxy Blackhole" cho route
# `auto`, và = id model thật khi người dùng chọn model khác.
- id: system-prompt
  config:
    personaPrefix: You are a coding agent powered by the {{model_label}} model.

# Phan dong gop session-log cho request official DeepSeek: tat (route da bi disable o tren, va
# khong de mot setting trong Chrome doc nhu the san pham nay tai du lieu len).
- id: session-log-deepseek
  disabled: true

# Feedback o lai may nay: backend OTel cua stock se gui tien to Session-log khi nguoi dung bam
# feedback; Galaxy giu remark trong Session log cuc bo va de gbh-brand gui bang email.
# Co the doi tung lan chay bang DSH_TELEMETRY_MODE / DSH_TELEMETRY_OTLP_URL.
- id: session-telemetry-otel
  config:
    mode: DISABLED

# Feedback chi con trong Settings: tat /feedback va dialog overlay cua stock; section "Phan hoi"
# cua Galaxy (gbh-brand) so huu form, mail draft va event feedback/record cuc bo.
- id: command-feedback
  disabled: true

- id: ui-message-feedback
  disabled: true


# 10/11/2026 (Lead): row CHƯA TỪNG được mount — gói packages/host/workspace-changes khai gbh.row.id
# "workspace-changes" nhưng không bundle patch nào (bundle/cordis.patch.yml + bundle-base là patch SINH
# TỰ ĐỘNG từ dsh-base nên không được sửa tay) khai row đó ⇒ tuyến /api/changes.summary không tồn tại
# ⇒ client ui-deliverables gọi vào bị 404 (1 lỗi console duy nhất của app). Khai ở lớp home, đúng chỗ
# các row ngoài bundle khác đang được khai.
- insert:
    - id: workspace-changes
      name: '@galaxy-blackhole/gbh-host-workspace-changes'

- id: preset-standard
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@galaxy-blackhole/gbh-persona'
        config:
          prefix: You are a coding agent powered by the {{model_label}} model.
      - id: agent-instructions
        name: '@galaxy-blackhole/gbh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@galaxy-blackhole/gbh-time-context'
      - id: tool-bash
        name: '@galaxy-blackhole/gbh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@galaxy-blackhole/gbh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@galaxy-blackhole/gbh-tool-fs'
      - id: tool-fs-search
        name: '@galaxy-blackhole/gbh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@galaxy-blackhole/gbh-host-tool-jobs'
      - id: tool-schedule
        name: '@galaxy-blackhole/gbh-tool-schedule'
      - id: skill-filesystem
        name: '@galaxy-blackhole/gbh-host-skill-filesystem'
      - id: tool-skill
        name: '@galaxy-blackhole/gbh-host-tool-skill'
      - id: command-goal
        name: '@galaxy-blackhole/gbh-command-goal'
      - id: tool-goal
        name: '@galaxy-blackhole/gbh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@galaxy-blackhole/gbh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
        disabled: true
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@galaxy-blackhole/gbh-compaction-basic'
          - id: command-compact
            name: '@galaxy-blackhole/gbh-command-compact'
          - id: tool-result-pruner
            name: '@galaxy-blackhole/gbh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
        disabled: true
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@galaxy-blackhole/gbh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@galaxy-blackhole/gbh-tool-subagent-control/list-agents'
          - id: tool-subagent
            name: '@galaxy-blackhole/gbh-host-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
          - id: tool-subagent-fork
            name: '@galaxy-blackhole/gbh-host-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: workflow-ptc
            name: '@galaxy-blackhole/gbh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@galaxy-blackhole/gbh-tool-workflow'
        disabled: true
      - id: tool-ask-user
        name: '@galaxy-blackhole/gbh-host-tool-ask-user'
      - id: tool-todo
        name: '@galaxy-blackhole/gbh-host-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@galaxy-blackhole/gbh-host-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@galaxy-blackhole/gbh-host-tool-present'
      - id: tool-plugin-manager
        name: '@galaxy-blackhole/gbh-host-plugin-manager/tools'
        disabled: true
      - id: tool-plugin-market
        name: '@galaxy-blackhole/gbh-plugin-market/tools'
        disabled: true
