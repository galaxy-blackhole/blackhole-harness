# desc Bản sao 1:1 cordis.patch.yml của bundle gốc — THÂN patch giữ nguyên văn, chỉ thay id theo bản đồ gói ta

- insert:
    - id: speech-to-text
      name: '@galaxy-blackhole/gbh-experimental-speech-to-text'
      config:
        defaultProvider: sensevoice-local
    - id: speech-to-text-sensevoice
      name: '@galaxy-blackhole/gbh-experimental-speech-to-text-sensevoice'
      config:
        dataRoot: !!js dshHomePath('speech-to-text', 'sensevoice')
    - id: api-speech-to-text
      name: '@galaxy-blackhole/gbh-experimental-api-speech-to-text'
    - id: ui-voice-input
      name: '@galaxy-blackhole/gbh-experimental-client-ui-voice-input'
