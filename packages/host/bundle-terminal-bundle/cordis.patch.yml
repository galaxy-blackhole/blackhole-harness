# desc Bản sao 1:1 cordis.patch.yml của bundle gốc — THÂN patch giữ nguyên văn, chỉ thay id theo bản đồ gói ta

- insert:
    - id: optional-persistent-terminals
      name: cordis:group
      group: true
      isolate:
        terminals: true
      config:
        - id: optional-terminal-registry
          name: '@galaxy-blackhole/gbh-terminal'
        - id: optional-terminal-bash
          name: '@galaxy-blackhole/gbh-terminal-bash'
          disabled: !!js process.platform === 'win32'
        - id: optional-terminal-pwsh
          name: '@galaxy-blackhole/gbh-terminal-bash'
          disabled: !!js process.platform !== 'win32'
          config:
            shellDialect: pwsh
        - id: optional-tool-terminal
          name: '@galaxy-blackhole/gbh-tool-terminal'
