# desc Bản sao 1:1 cordis.patch.yml của bundle gốc — THÂN patch giữ nguyên văn, chỉ thay id theo bản đồ gói ta

- insert:
    - id: optional-session-search
      name: cordis:group
      group: true
      isolate:
        sessionQuery: true
      config:
        - id: optional-session-query-sqlite
          name: '@galaxy-blackhole/gbh-session-query-sqlite'
          config:
            path: ':memory:'
            openAt: first-search
        - id: optional-tool-session-query
          name: '@galaxy-blackhole/gbh-tool-session-query'
